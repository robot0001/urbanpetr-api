version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: true
    staticcheck:
      checks:
        - SA*
        - S1*
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
