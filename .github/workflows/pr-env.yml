name: PR Stage Env

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

env:
  AWS_REGION: eu-central-1
  ARTIFACTS_BUCKET: urbanpetr-artifacts-staging

jobs:
  provision:
    name: Provision PR env
    if: >
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'stage')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build Lambda binary
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bootstrap ./cmd/api
          zip -j lambda.zip bootstrap

      - name: Configure Git credentials
        run: git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure placeholder artifact exists
        run: |
          if ! aws s3 ls "s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/placeholder.zip" 2>/dev/null; then
            python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/placeholder.zip","w"); z.writestr("bootstrap","placeholder"); z.close()'
            aws s3 cp /tmp/placeholder.zip "s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/placeholder.zip"
          fi

      - name: Upload PR artifact to S3
        run: |
          aws s3 cp lambda.zip \
            s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/pr-${{ github.event.number }}/${{ github.sha }}.zip

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform/envs/staging
        run: |
          terraform init -input=false \
            -backend-config="key=urbanpetr_api/pr-${{ github.event.number }}/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform/envs/staging
        run: |
          terraform apply -auto-approve -input=false \
            -var="pr_number=${{ github.event.number }}" \
            -var="project_name=urbanpetr-api"

      - name: Update Lambda code
        env:
          PR: ${{ github.event.number }}
          S3_KEY: urbanpetr-api/pr-${{ github.event.number }}/${{ github.sha }}.zip
        run: |
          for fn in \
            "urbanpetr-api-staging-${PR}" \
            "urbanpetr-api-staging-${PR}-migrations" \
            "urbanpetr-api-staging-${PR}-seed"; do
            aws lambda update-function-code \
              --function-name "$fn" \
              --s3-bucket "${{ env.ARTIFACTS_BUCKET }}" \
              --s3-key "$S3_KEY"
            aws lambda wait function-updated-v2 --function-name "$fn"
          done

      - name: Run migrations
        run: |
          aws lambda invoke \
            --function-name "urbanpetr-api-staging-${{ github.event.number }}-migrations" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json
          if jq -e '.errorMessage' response.json > /dev/null 2>&1; then
            echo "::error::Migrations Lambda returned an error"
            exit 1
          fi

      - name: Run seed
        run: |
          aws lambda invoke \
            --function-name "urbanpetr-api-staging-${{ github.event.number }}-seed" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json
          if jq -e '.errorMessage' response.json > /dev/null 2>&1; then
            echo "::error::Seed Lambda returned an error"
            exit 1
          fi

      - name: Get API URL
        id: api_url
        working-directory: terraform/envs/staging
        run: echo "value=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"

      - name: Post staging URL to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} \
            --body "**Staging env ready** \`${{ steps.api_url.outputs.value }}/health\`" \
            --edit-last \
            || gh pr comment ${{ github.event.number }} \
              --body "**Staging env ready** \`${{ steps.api_url.outputs.value }}/health\`"

  destroy:
    name: Destroy PR env
    if: >
      github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'stage')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure Git credentials
        run: git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if staging env exists
        id: check
        run: |
          if aws s3 ls "s3://urbanpetr-tf-state-staging/urbanpetr_api/pr-${{ github.event.number }}/terraform.tfstate" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v4
        if: steps.check.outputs.exists == 'true'
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        if: steps.check.outputs.exists == 'true'
        working-directory: terraform/envs/staging
        run: |
          terraform init -input=false \
            -backend-config="key=urbanpetr_api/pr-${{ github.event.number }}/terraform.tfstate"

      - name: Terraform destroy
        if: steps.check.outputs.exists == 'true'
        working-directory: terraform/envs/staging
        run: |
          terraform destroy -auto-approve -input=false \
            -var="pr_number=${{ github.event.number }}" \
            -var="project_name=urbanpetr-api"

      - name: Delete PR artifacts from S3
        if: steps.check.outputs.exists == 'true'
        run: |
          aws s3 rm \
            s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/pr-${{ github.event.number }}/ \
            --recursive
