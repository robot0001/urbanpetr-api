name: PR Stage Env

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

env:
  AWS_REGION: eu-central-1
  ARTIFACTS_BUCKET: urbanpetr-artifacts-staging

jobs:
  provision:
    name: Provision PR env
    if: >
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'stage')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build Lambda binary
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bootstrap ./cmd/api
          zip -r lambda.zip bootstrap migrations/

      - name: Configure Git credentials
        run: git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure placeholder artifact exists
        run: |
          if ! aws s3 ls "s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/placeholder.zip" 2>/dev/null; then
            python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/placeholder.zip","w"); z.writestr("bootstrap","placeholder"); z.close()'
            aws s3 cp /tmp/placeholder.zip "s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/placeholder.zip"
          fi

      - name: Upload PR artifact to S3
        run: |
          aws s3 cp lambda.zip \
            s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/pr-${{ github.event.number }}/${{ github.sha }}.zip

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform init (staging-base)
        working-directory: terraform/envs/staging-base
        run: terraform init -input=false

      - name: Terraform apply (staging-base)
        working-directory: terraform/envs/staging-base
        run: terraform apply -auto-approve -input=false

      - name: Terraform init
        working-directory: terraform/envs/staging
        run: |
          terraform init -input=false \
            -backend-config="key=urbanpetr_api/pr-${{ github.event.number }}/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform/envs/staging
        run: |
          terraform apply -auto-approve -input=false \
            -var="pr_number=${{ github.event.number }}" \
            -var="project_name=urbanpetr-api"

      - name: Update Lambda code
        env:
          PR: ${{ github.event.number }}
          S3_KEY: urbanpetr-api/pr-${{ github.event.number }}/${{ github.sha }}.zip
        run: |
          for fn in \
            "urbanpetr-api-staging-${PR}" \
            "urbanpetr-api-staging-${PR}-migrations" \
            "urbanpetr-api-staging-${PR}-seed"; do
            aws lambda update-function-code \
              --function-name "$fn" \
              --s3-bucket "${{ env.ARTIFACTS_BUCKET }}" \
              --s3-key "$S3_KEY"
            aws lambda wait function-updated-v2 --function-name "$fn"
          done

      - name: Run migrations
        run: |
          aws lambda invoke \
            --function-name "urbanpetr-api-staging-${{ github.event.number }}-migrations" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json
          if jq -e '.errorMessage' response.json > /dev/null 2>&1; then
            echo "::error::Migrations Lambda returned an error"
            exit 1
          fi

      - name: Run seed
        run: |
          aws lambda invoke \
            --function-name "urbanpetr-api-staging-${{ github.event.number }}-seed" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json
          if jq -e '.errorMessage' response.json > /dev/null 2>&1; then
            echo "::error::Seed Lambda returned an error"
            exit 1
          fi

      - name: Get API Gateway DNS info
        working-directory: terraform/envs/staging
        run: |
          TF_OUT=$(terraform output -json 2>/dev/null)
          echo "API_GW_TARGET=$(echo "$TF_OUT" | jq -r '.api_gateway_target_domain.value // ""')" >> "$GITHUB_ENV"
          echo "API_GW_ZONE=$(echo "$TF_OUT" | jq -r '.api_gateway_hosted_zone_id.value // ""')" >> "$GITHUB_ENV"
          echo "CUSTOM_DOMAIN_URL=$(echo "$TF_OUT" | jq -r '.custom_domain_url.value // ""')" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (prod — Route53)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upsert Route53 DNS record
        env:
          PR: ${{ github.event.number }}
        run: |
          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "urbanpetr.com." \
            --query "HostedZones[?Name=='urbanpetr.com.'].Id" \
            --output text | sed 's|/hostedzone/||')
          aws route53 change-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --change-batch "{
              \"Changes\": [{
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                  \"Name\": \"api-stage${PR}.urbanpetr.com\",
                  \"Type\": \"A\",
                  \"AliasTarget\": {
                    \"HostedZoneId\": \"${API_GW_ZONE}\",
                    \"DNSName\": \"${API_GW_TARGET}\",
                    \"EvaluateTargetHealth\": false
                  }
                }
              }]
            }"

      - name: Post staging URL to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} \
            --body "**Staging env ready** \`${{ env.CUSTOM_DOMAIN_URL }}/health\`" \
            --edit-last \
            || gh pr comment ${{ github.event.number }} \
              --body "**Staging env ready** \`${{ env.CUSTOM_DOMAIN_URL }}/health\`"

  destroy:
    name: Destroy PR env
    if: >
      github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'stage')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure Git credentials
        run: git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if staging env exists
        id: check
        run: |
          if aws s3 ls "s3://urbanpetr-tf-state-staging/urbanpetr_api/pr-${{ github.event.number }}/terraform.tfstate" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        if: steps.check.outputs.exists == 'true'
        working-directory: terraform/envs/staging
        run: |
          terraform init -input=false \
            -backend-config="key=urbanpetr_api/pr-${{ github.event.number }}/terraform.tfstate"

      - name: Get API Gateway DNS info
        if: steps.check.outputs.exists == 'true'
        working-directory: terraform/envs/staging
        run: |
          TF_OUT=$(terraform output -json 2>/dev/null)
          echo "API_GW_TARGET=$(echo "$TF_OUT" | jq -r '.api_gateway_target_domain.value // ""')" >> "$GITHUB_ENV"
          echo "API_GW_ZONE=$(echo "$TF_OUT" | jq -r '.api_gateway_hosted_zone_id.value // ""')" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (prod — Route53)
        if: steps.check.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete Route53 DNS record
        if: steps.check.outputs.exists == 'true'
        env:
          PR: ${{ github.event.number }}
        run: |
          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "urbanpetr.com." \
            --query "HostedZones[?Name=='urbanpetr.com.'].Id" \
            --output text | sed 's|/hostedzone/||')
          aws route53 change-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --change-batch "{
              \"Changes\": [{
                \"Action\": \"DELETE\",
                \"ResourceRecordSet\": {
                  \"Name\": \"api-stage${PR}.urbanpetr.com\",
                  \"Type\": \"A\",
                  \"AliasTarget\": {
                    \"HostedZoneId\": \"${API_GW_ZONE}\",
                    \"DNSName\": \"${API_GW_TARGET}\",
                    \"EvaluateTargetHealth\": false
                  }
                }
              }]
            }" || true

      - name: Configure AWS credentials (staging — destroy)
        if: steps.check.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform destroy
        if: steps.check.outputs.exists == 'true'
        working-directory: terraform/envs/staging
        run: |
          terraform destroy -auto-approve -input=false \
            -var="pr_number=${{ github.event.number }}" \
            -var="project_name=urbanpetr-api"

      - name: Delete PR artifacts from S3
        if: steps.check.outputs.exists == 'true'
        run: |
          aws s3 rm \
            s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/pr-${{ github.event.number }}/ \
            --recursive

      # staging-base (incl. the shared staging NAT Gateway — see
      # urbanpetr-api/terraform/envs/staging-base) is also used by
      # football-api's PR envs, not just this repo's. Only tear it down
      # when NEITHER repo has an open PR with the `stage` label — an S3
      # state-file listing isn't reliable here (old PRs can leave a
      # non-empty state object behind without a real active env), so ask
      # GitHub directly.
      - name: Check for remaining active PR envs (both repos)
        id: check_remaining
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_MODULES_PAT }}
        run: |
          API_COUNT=$(gh pr list --repo robot0001/urbanpetr-api --label stage --state open --json number --jq 'length')
          FOOTBALL_COUNT=$(gh pr list --repo robot0001/football-api --label stage --state open --json number --jq 'length')
          echo "count=$((API_COUNT + FOOTBALL_COUNT))" >> "$GITHUB_OUTPUT"

      - name: Terraform init (staging-base)
        if: steps.check_remaining.outputs.count == '0'
        working-directory: terraform/envs/staging-base
        run: terraform init -input=false

      - name: Terraform destroy (staging-base)
        if: steps.check_remaining.outputs.count == '0'
        working-directory: terraform/envs/staging-base
        run: terraform destroy -auto-approve -input=false
