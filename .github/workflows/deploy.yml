name: Prod Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

env:
  AWS_REGION: eu-central-1
  ARTIFACTS_BUCKET: urbanpetr-artifacts

jobs:
  # ── PR jobs ───────────────────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.50.3

      - name: tflint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: |
          find terraform -name "*.tf" -exec dirname {} \; | sort -u | while IFS= read -r dir; do
            echo "--- tflint: $dir"
            tflint --chdir "$dir" || exit 1
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}-

      - name: Run tests
        run: go test ./... -v -count=1

  terraform_plan:
    name: Terraform plan (prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Git credentials
        run: git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform/envs/prod
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform/envs/prod
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/envs/prod
        run: terraform plan -input=false -no-color

  # ── Main branch jobs ──────────────────────────────────────────────────────

  build:
    name: Build Lambda binary
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}-

      - name: Build
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bootstrap ./cmd/api
          zip -j lambda.zip bootstrap
          zip -r lambda.zip migrations/

      - uses: actions/upload-artifact@v5
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 7

  upload:
    name: Upload artifact to S3
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v5
        with:
          name: lambda-zip

      - name: Upload to S3
        run: |
          aws s3 cp lambda.zip \
            s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/${{ github.sha }}.zip

  terraform_apply:
    name: Terraform apply (prod)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Git credentials
        run: git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform/envs/prod
        run: terraform init -input=false

      - name: Ensure placeholder artifact exists
        run: |
          if ! aws s3 ls "s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/placeholder.zip" 2>/dev/null; then
            python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/placeholder.zip","w"); z.writestr("bootstrap","placeholder"); z.close()'
            aws s3 cp /tmp/placeholder.zip "s3://${{ env.ARTIFACTS_BUCKET }}/urbanpetr-api/placeholder.zip"
          fi

      - name: Terraform apply
        working-directory: terraform/envs/prod
        run: terraform apply -auto-approve -input=false

  update_lambdas:
    name: Update Lambda code
    runs-on: ubuntu-latest
    needs: [upload, terraform_apply]
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    env:
      S3_KEY: urbanpetr-api/${{ github.sha }}.zip

    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update API Lambda
        run: |
          aws lambda update-function-code \
            --function-name urbanpetr-api-prod \
            --s3-bucket ${{ env.ARTIFACTS_BUCKET }} \
            --s3-key ${{ env.S3_KEY }}
          aws lambda wait function-updated-v2 --function-name urbanpetr-api-prod

      - name: Update migrations Lambda
        run: |
          aws lambda update-function-code \
            --function-name urbanpetr-api-prod-migrations \
            --s3-bucket ${{ env.ARTIFACTS_BUCKET }} \
            --s3-key ${{ env.S3_KEY }}
          aws lambda wait function-updated-v2 --function-name urbanpetr-api-prod-migrations

  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    needs: update_lambdas
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke migrations Lambda
        run: |
          aws lambda invoke \
            --function-name urbanpetr-api-prod-migrations \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json
          if jq -e '.errorMessage' response.json > /dev/null 2>&1; then
            echo "::error::Migrations Lambda returned an error"
            exit 1
          fi

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: migrate
    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Health check
        run: curl -f --retry 3 --retry-delay 5 https://api.urbanpetr.com/health

